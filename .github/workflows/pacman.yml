# ============================================================
#   Place this file at: .github/workflows/pacman.yml
#   inside your profile repo: vinnu112p/vinnu112p
# ============================================================

name: 🐍 Generate Snake & Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # Runs every 12 hours automatically
  workflow_dispatch:           # Manual trigger from Actions tab
  push:
    branches:
      - main
      - master

jobs:
  generate:
    name: 🎮 Generate Contribution Animations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: 🐍 Generate Snake & Pacman SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: vinnu112p
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#30363d,#6e7681,#8b949e,#f0f6fc
            dist/github-contribution-grid-pacman.svg?color_snake=#24292f&color_dots=#ebedf0,#d0d7de,#8c959f,#57606a,#24292f
            dist/github-contribution-grid-pacman-dark.svg?color_snake=#ffffff&color_dots=#161b22,#30363d,#6e7681,#8b949e,#f0f6fc

      - name: 🚀 Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ============================================================
# After running, your SVG URLs will be:
#
# Snake (dark):  https://raw.githubusercontent.com/vinnu112p/vinnu112p/output/github-contribution-grid-snake-dark.svg
# Snake (light): https://raw.githubusercontent.com/vinnu112p/vinnu112p/output/github-contribution-grid-snake.svg
# Pacman (dark): https://raw.githubusercontent.com/vinnu112p/vinnu112p/output/github-contribution-grid-pacman-dark.svg
# ============================================================
